<h1>Privacy policy</h1>
<p>rclone-drive is used only by its owner.</p>
<p>It uses the Google Drive <code>drive.file</code> scope, so it can access only the files it creates in the owner's Google Drive.</p>
<p>It does not collect, store, sell, or share any user data. Files stay in the owner's Google Drive.</p>
